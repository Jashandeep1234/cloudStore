spring.application.name=aiService
server.port=${SERVER_PORT:8084}
# Database
spring.datasource.url=:${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ✅ GEMINI API CONFIGURATION - UPDATED
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}

gemini.api.vision-model=${GEMINI_VISION_MODEL:gemini-3.5-flash}
gemini.api.timeout=60000
gemini.api.max-tokens=2048
gemini.api.temperature=0.7

# File upload
file.upload.max-size=52428800
file.upload.allowed-types=pdf,txt,docx,doc,png,jpg,jpeg,gif,bmp,webp,csv,xlsx,xls
file.storage.path=${user.home}/ai-service-uploads
file.storage.temp-path=${user.home}/ai-service-temp

# Service URLs
file-service.url=${FILE_SERVICE_URL:http://localhost:8081/api}
folder-service.url=${FOLDER_SERVICE_URL:http://localhost:8082/api}

# Logging
logging.level.root=INFO
logging.level.com.ck=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cache
spring.cache.type=simple
spring.cache.cache-names=conversations,file-summaries

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# JPA
spring.jpa.open-in-view=false

# Database Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=60000

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true