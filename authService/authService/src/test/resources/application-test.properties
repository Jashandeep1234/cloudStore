# ============================================================
#  Test profile - replaces PostgreSQL with in-memory H2 and
#  disables Eureka so the Spring context can boot in CI.
# ============================================================

spring.datasource.url=jdbc:h2:mem:drive_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

app.jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTI1Ni1iaXRzLW9r

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
