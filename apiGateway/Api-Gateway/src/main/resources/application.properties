spring.application.name=Api-Gateway

server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===========================
# FILE SERVICE
# ===========================
spring.cloud.gateway.server.webflux.routes[0].id=file-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://fileService
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/files/**

# ===========================
# FOLDER SERVICE
# ===========================
spring.cloud.gateway.server.webflux.routes[1].id=folder-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://folderService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/folder/**

# ===========================
# SEARCH SERVICE
# ===========================
spring.cloud.gateway.server.webflux.routes[2].id=search-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://searchService
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/search/**

# ===========================
# AI SERVICE - Analysis
# ===========================
spring.cloud.gateway.server.webflux.routes[4].id=ai-service-analyze
spring.cloud.gateway.server.webflux.routes[4].uri=lb://aiService
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/ai/analyze/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/ai/analyze(?<segment>/?.*),/api/analyze${segment}

# ===========================
# AI SERVICE - Conversations
# ===========================
spring.cloud.gateway.server.webflux.routes[5].id=ai-service-conversations
spring.cloud.gateway.server.webflux.routes[5].uri=lb://aiService
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/ai/conversations/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/api/ai/conversations(?<segment>/?.*),/api/conversations${segment}

# ===========================
# AI SERVICE - File Operations
# ===========================
spring.cloud.gateway.server.webflux.routes[6].id=ai-service-files
spring.cloud.gateway.server.webflux.routes[6].uri=lb://aiService
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/ai/files/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/api/ai/files(?<segment>/?.*),/api/files${segment}


# ===========================
# AUTH SERVICE
# ===========================
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**